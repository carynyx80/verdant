packages:
  - apps/*
  - packages/*
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  keccak: true
  secp256k1: true
  bufferutil: false
  utf-8-validate: false
  msgpackr-extract: false
# Keep dependency age protection enabled for reproducible hosted installs.
minimumReleaseAge: 1440
overrides:
  'zustand@^5.0.0': 5.0.15
